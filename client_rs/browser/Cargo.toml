[package]
name = "atm0s-media-client-browser"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.84"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
atm0s-media-client-core = { path = "../core" }
media-server-protocol = { package = "atm0s-media-server-protocol", path = "../../packages/protocol", default-features = false }
prost = "0.13"
wasm-bindgen = "=0.2.123"
wasm-bindgen-futures = "=0.4.73"
js-sys = "=0.3.100"
web-sys = { version = "=0.3.100", features = [
    "AbortController", "AbortSignal", "BinaryType", "Blob", "Document", "DomException",
    "Event", "EventTarget", "Headers", "HtmlElement", "HtmlMediaElement",
    "MediaDeviceInfo", "MediaDevices", "MediaStream", "MediaStreamConstraints",
    "MediaStreamTrack", "MessageEvent", "Navigator", "Performance", "RtcConfiguration",
    "RtcDataChannel", "RtcDataChannelInit", "RtcDataChannelState", "RtcDataChannelType",
    "RtcIceCandidate", "RtcIceCandidateInit", "RtcRtpTransceiverInit",
    "RtcIceConnectionState", "RtcIceGatheringState", "RtcPeerConnection", "RtcPeerConnectionState",
    "RtcPeerConnectionIceEvent", "RtcRtpSender", "RtcRtpTransceiver", "RtcRtpTransceiverDirection",
    "RtcSdpType", "RtcSessionDescriptionInit", "RtcSessionDescription", "RtcOfferOptions",
    "RtcTrackEvent", "Request", "RequestInit", "Response", "Window", "Performance", "console"
] }

[features]
default = []

[[example]]
name = "http_deadline_probe"
path = "tests/http_deadline_probe/probe.rs"
crate-type = ["cdylib"]
