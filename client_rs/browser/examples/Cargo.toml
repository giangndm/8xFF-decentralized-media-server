[package]
name = "atm0s-media-client-browser-examples"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
atm0s-media-client-browser = { path = ".." }
atm0s-media-client-core = { path = "../../core" }
media-server-protocol = { package = "atm0s-media-server-protocol", path = "../../../packages/protocol", default-features = false }
prost = "0.13"
wasm-bindgen = "=0.2.123"
wasm-bindgen-futures = "=0.4.73"
web-sys = { version = "=0.3.100", features = ["Window", "Location", "Document", "Element", "HtmlInputElement", "HtmlSelectElement", "Navigator", "console", "MediaStream", "MediaStreamTrack", "HtmlMediaElement", "HtmlVideoElement", "VideoPlaybackQuality", "RtcConfiguration"] }
js-sys = "=0.3.100"
sycamore = { version = "=0.9.2", default-features = false, features = ["web"] }
