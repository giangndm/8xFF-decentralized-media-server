[package]
name = "atm0s-media-server-protocol"
version = "0.2.0-alpha.1"
authors = ["Giang Minh <giang.ndm@gmail.com>"]
edition = "2021"
license = "MIT"
description = "Core Protocol Component for Atm0s Media Server"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bincode = { workspace = true, optional = true }
log = { workspace = true, optional = true }
convert-enum = { workspace = true, optional = true }
derivative = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["full"], optional = true }
rand = { workspace = true, optional = true }
prost = { workspace = true }
serde = { workspace = true, features = ["derive"] }
quinn = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }

[build-dependencies]
prost-build = { workspace = true, optional = true }
tera = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }

[features]
default = ["server"]
# Disable defaults for a portable Protobuf-only dependency (including WASM).
server = ["dep:bincode", "dep:log", "dep:convert-enum", "dep:derivative", "dep:derive_more", "dep:rand", "dep:tokio"]
build-protobuf = ["dep:prost-build", "dep:tera"]
quinn-rpc = ["server", "dep:quinn"]
